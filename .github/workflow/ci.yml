name: CI - Basic Checks

# 🔁 Déclenchement automatique du workflow
on:
  # Quand on pousse du code sur develop ou ta branche feature
  push:
    branches:
      - develop
      - feature/get-grade-project
  # Quand on crée une pull request vers develop
  pull_request:
    branches:
      - develop

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

  lint:
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Run ESLint
        run: npx eslint . --ext .ts,.js

  type-check:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Run TypeScript check
        run: npx tsc --noEmit