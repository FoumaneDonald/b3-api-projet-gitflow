name: 🤖 LLM Code Review & Team Notification

on:
  pull_request:
    types: [opened, synchronize]
    branches: [develop]

jobs:
  review_and_notify:
    name: AI Review & Email
    runs-on: ubuntu-latest

    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
      MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
      TEAM_EMAIL_LIST: ${{ secrets.TEAM_EMAIL_LIST }}
      LLM_API_URL: https://generativelanguage.googleapis.com/v1beta/models/gemini-pro:generateContent

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1️⃣ Récupérer uniquement le diff des fichiers pertinents (ex: src/**)
      - name: Get relevant diff
        id: diff
        run: |
          git fetch origin develop
          git diff origin/develop...HEAD -- 'src/**' '*.ts' '*.js' > diff.txt

          if [ ! -s diff.txt ]; then
            echo "Aucun fichier pertinent modifié, rien à envoyer au LLM."
            echo "diff=" >> $GITHUB_OUTPUT
          else
            echo "diff<<EOF" >> $GITHUB_OUTPUT
            cat diff.txt >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          fi

      # 2️⃣ Appel à l'API Gemini pour analyse
      - name: Call Gemini API for code review
        id: call_llm
        if: ${{ steps.diff.outputs.diff != '' }}
        run: |
          REVIEW=$(curl -s -X POST "$LLM_API_URL" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $GEMINI_API_KEY" \
            -d "{
              'contents': [
                {
                  'parts': [
                    {
                      'text': 'Tu es un relecteur de code expert. Analyse le diff suivant :\n${{ steps.diff.outputs.diff }}\n\nRéponds en format Markdown structuré :\n\n✅ **Résumé général**\n🔴 **Problèmes identifiés**\n💡 **Suggestions d’amélioration**\n\nSois précis et concis, en français.'
                    }
                  ]
                }
              ]
            }" | jq -r '.candidates[0].content.parts[0].text')

          if [ -z "$REVIEW" ]; then
            REVIEW="⚠️ L’analyse LLM n’a pas retourné de résultat."
          fi

          echo "review<<EOF" >> $GITHUB_OUTPUT
          echo "$REVIEW" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      # 3️⃣ Commentaire automatique sur la Pull Request
      - name: Comment on Pull Request
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const review = `${{ steps.call_llm.outputs.review }}`;
            const body = `🤖 **Revue automatique par IA (Gemini)** pour @${{ github.actor }} :\n\n${review}`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });

      # 4️⃣ Envoi d'email à toute l'équipe
      - name: Send email notification
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "Revue IA - PR #${{ github.event.pull_request.number }} par @${{ github.actor }}"
          to: ${{ secrets.TEAM_EMAIL_LIST }}
          from: "LLM Review Bot <${{ secrets.MAIL_USERNAME }}>"
          body: |
            Bonjour équipe 👋,

            Une nouvelle Pull Request vient d’être ouverte par **@${{ github.actor }}**.

            Voici la revue générée automatiquement par l’IA 🤖 :

            ${{ steps.call_llm.outputs.review }}

            ➤ Lien vers la PR : ${{ github.event.pull_request.html_url }}
