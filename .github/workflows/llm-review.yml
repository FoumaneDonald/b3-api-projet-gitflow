name: 🤖 LLM Review & Smart Email

on:
  pull_request:
    types: [opened, synchronize]
    branches: [develop]

jobs:
  ai_review:
    runs-on: ubuntu-latest
    name: AI Code Review & Email

    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
      MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
      TEAM_EMAIL_LIST: ${{ secrets.TEAM_EMAIL_LIST }}
      LLM_API_URL: https://generativelanguage.googleapis.com/v1beta/models/gemini-pro:generateContent

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get PR diff (src only)
        id: diff
        run: |
          git fetch origin develop
          git diff origin/develop...HEAD -- 'src/**' '*.js' '*.ts' > diff.txt

          if [ ! -s diff.txt ]; then
            echo "diff=" >> $GITHUB_OUTPUT
            echo "Aucun diff pertinent trouvé."
          else
            echo "diff<<EOF" >> $GITHUB_OUTPUT
            cat diff.txt >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          fi

      - name: Analyze diff with Gemini
        id: gemini
        if: ${{ steps.diff.outputs.diff != '' }}
        run: |
          echo "🔍 Envoi du diff à Gemini..."
          echo "${{ steps.diff.outputs.diff }}" | head -n 20
          
          RESPONSE=$(curl -s -X POST "$LLM_API_URL" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $GEMINI_API_KEY" \
            -d "{
              'contents': [
                {
                  'parts': [
                    {
                      'text': 'Tu es un relecteur de code expert. Analyse ce diff:\n${{ steps.diff.outputs.diff }}\n\nRéponds en Markdown avec:\n✅ Résumé\n🔴 Problèmes\n💡 Suggestions.'
                    }
                  ]
                }
              ]
            }")

          echo "Réponse brute Gemini :"
          echo "$RESPONSE" | head -c 500

          REVIEW=$(echo "$RESPONSE" | jq -r '.candidates[0].content.parts[0].text // empty')

          if [ -z "$REVIEW" ]; then
            REVIEW="⚠️ Aucune réponse générée par Gemini (vérifie la clé API ou la requête)."
          fi

          echo "review<<EOF" >> $GITHUB_OUTPUT
          echo "$REVIEW" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Comment on PR
        if: ${{ steps.diff.outputs.diff != '' }}
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const review = `${{ steps.gemini.outputs.review }}`;
            const body = `🤖 **Revue IA (Gemini)** pour @${{ github.actor }}:\n\n${review}`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });

      - name: Send email to team
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "Revue IA PR #${{ github.event.pull_request.number }} - @${{ github.actor }}"
          to: ${{ secrets.TEAM_EMAIL_LIST }}
          from: "LLM Review Bot <${{ secrets.MAIL_USERNAME }}>"
          body: |
            Bonjour équipe 👋,

            Une nouvelle Pull Request a été soumise par **@${{ github.actor }}**.

            Voici la revue IA automatique :  

            ${{ steps.gemini.outputs.review }}

            🔗 Lien vers la PR : ${{ github.event.pull_request.html_url }}

