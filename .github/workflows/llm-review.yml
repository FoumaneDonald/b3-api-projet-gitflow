name: LLM Code Review & Notification

on:
  pull_request:
    types: [opened, synchronize]
    branches: [develop]

jobs:
  review_and_notify:
    runs-on: ubuntu-latest

    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
      MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
      TEAM_EMAIL_LIST: ${{ secrets.TEAM_EMAIL_LIST }}
      LLM_API_URL: https://generativelanguage.googleapis.com/v1beta/{model=models/*}:generateContent

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get diff of the Pull Request
        id: diff
        run: |
          git fetch origin develop
          git diff origin/develop...HEAD > diff.txt
          echo "diff<<EOF" >> $GITHUB_OUTPUT
          cat diff.txt >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Call Gemini API for code review
        id: call_llm
        run: |
          REVIEW=$(curl -s -X POST "$LLM_API_URL" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $GEMINI_API_KEY" \
            -d "{
              'contents': [{'parts':[{'text': 'Tu es un relecteur de code expert. Analyse ce diff :\n${{ steps.diff.outputs.diff }}\nSi le code est bon, donne des pistes d’amélioration. S’il contient des bugs, liste-les. Réponds en français.'}]}]
            }" | jq -r '.candidates[0].content.parts[0].text')
          echo "review=$REVIEW" >> $GITHUB_OUTPUT

      - name: Comment on Pull Request
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const review = `${{ steps.call_llm.outputs.review }}`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🤖 **Revue automatique par IA (Gemini)** pour @${{ github.actor }} :\n\n${review}`
            });

      - name: Send email notification
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "Revue IA - PR #${{ github.event.pull_request.number }} par @${{ github.actor }}"
          to: ${{ secrets.TEAM_EMAIL_LIST }}
          from: "LLM Review Bot <${{ secrets.MAIL_USERNAME }}>"
          body: |
            Bonjour équipe 👋

            Une nouvelle Pull Request vient d’être ouverte par @${{ github.actor }}.

            Voici la revue générée par l’IA :

            ${{ steps.call_llm.outputs.review }}

            ➤ Voir la PR ici : ${{ github.event.pull_request.html_url }}
