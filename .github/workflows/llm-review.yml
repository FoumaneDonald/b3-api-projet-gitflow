      - name: Get PR diff (src only)
        id: diff
        run: |
          echo "🔍 Récupération du diff..."
          git fetch origin develop || true
          git diff origin/develop...HEAD -- 'src/**' '*.js' '*.ts' > diff.txt || true
          if [ ! -s diff.txt ]; then
            echo "diff=" >> $GITHUB_OUTPUT
          else
            echo "✅ Diff récupéré :"
            head -n 10 diff.txt
            # Encode le diff en Base64 pour éviter les erreurs JSON
            DIFF_B64=$(base64 -w 0 diff.txt)
            echo "diff_b64=$DIFF_B64" >> $GITHUB_OUTPUT
          fi

      - name: Call LLM for Code Review
        id: llm
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          echo "🧠 Envoi du diff à l'IA..."
          RESPONSE=$(curl -s "https://generativelanguage.googleapis.com/v1beta/openai/chat/completions" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $GEMINI_API_KEY" \
            -d @- <<EOF
          {
            "model": "gemini-2.0-flash",
            "messages": [
              {
                "role": "user",
                "content": "Tu es un relecteur de code expert. Voici un diff encodé en Base64. Décode-le puis analyse le code comme d'habitude (en français).\n\nDiff Base64:\n${{ steps.diff.outputs.diff_b64 }}"
              }
            ]
          }
          EOF
          )

          echo "DEBUG LLM RESPONSE:"
          echo "$RESPONSE"

          FEEDBACK=$(echo "$RESPONSE" | grep -oP '"content":\s*"\K(.*)(?=")' | head -n 1 | sed 's/\\n/\n/g')

          if [ -z "$FEEDBACK" ]; then
            echo "⚠️ Aucun retour utile de l'IA."
          fi

          echo "LLM_RESPONSE<<EOF" >> $GITHUB_OUTPUT
          echo "$FEEDBACK" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
