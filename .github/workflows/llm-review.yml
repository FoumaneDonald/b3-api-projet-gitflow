name: LLM Review & Email Notification

on:
  pull_request:
    types: [opened, synchronize]
    branches: [develop]

jobs:
  review_and_notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Récupère tout l'historique Git

      - name: Get PR diff (src only)
        id: diff
        run: |
          echo "🔍 Récupération du diff entre la PR et develop..."
          git fetch --all --prune --unshallow || true

          # Vérifie si la branche develop existe
          if ! git rev-parse --verify origin/develop >/dev/null 2>&1; then
            echo "⚠️ La branche origin/develop n'existe pas encore sur ce dépôt."
            echo "diff=" >> $GITHUB_OUTPUT
            exit 0
          fi

          git fetch origin develop

          # Vérifie s'il existe une base commune
          if ! git merge-base --is-ancestor origin/develop HEAD; then
            echo "⚠️ Pas de base commune, affichage du diff complet."
            git diff HEAD -- 'src/**' '*.js' '*.ts' > diff.txt
          else
            git diff origin/develop...HEAD -- 'src/**' '*.js' '*.ts' > diff.txt
          fi

          if [ ! -s diff.txt ]; then
            echo "Aucun changement détecté dans src/"
            echo "diff=" >> $GITHUB_OUTPUT
          else
            echo "✅ Diff récupéré avec succès :"
            head -n 20 diff.txt
            echo "diff<<EOF" >> $GITHUB_OUTPUT
            cat diff.txt >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          fi

      - name: Call LLM for Code Review
        id: llm
        run: |
          echo "🧠 Envoi du diff à l'IA pour revue..."
          RESPONSE=$(curl -s -X POST "https://generativelanguage.googleapis.com/v1beta/{model=models/*}:generateContent" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ secrets.GEMINI_API_KEY }}" \
            -d @- <<EOF
          {
            "prompt": "Tu es un relecteur de code expert. Analyse ce diff et réponds en Markdown structuré avec trois sections : ✅ **Résumé**, 🔴 **Bugs détectés**, 💡 **Suggestions**. Réponds en français uniquement.\n\n${{ steps.diff.outputs.diff }}"
          }
          EOF
          )
          echo "LLM_RESPONSE<<EOF" >> $GITHUB_OUTPUT
          echo "$RESPONSE" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Comment on PR with LLM feedback
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const feedback = `${{ steps.llm.outputs.LLM_RESPONSE }}`.trim();
            if(feedback === "") {
              console.log("⚠️ Aucun retour de l'IA, aucun commentaire ajouté.");
            } else {
              const prNumber = context.payload.pull_request.number;
              const actor = context.actor;
              github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: `🤖 **Revue IA pour @${actor}**\n\n${feedback}`
              });
              console.log("✅ Commentaire IA ajouté sur la PR.");
            }

      - name: Send Email Notification
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "Revue IA pour PR #${{ github.event.pull_request.number }} par @${{ github.actor }}"
          to: ${{ secrets.TEAM_EMAIL_LIST }}
          from: ${{ secrets.MAIL_USERNAME }}
          body: |
            Bonjour l'équipe 👋,
            
            Une nouvelle revue IA vient d'être générée pour la Pull Request #${{ github.event.pull_request.number }} par @${{ github.actor }}.
            
            Voici le retour de l'IA :
            
            ${{ steps.llm.outputs.LLM_RESPONSE }}
